# Azure Container Apps CI/CD Pipeline: Build Once, Deploy Everywhere
on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    outputs:
      container-image: ${{ steps.publish.outputs.published-image }}
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE_ENV_TYPE: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install azd
        uses: Azure/setup-azd@v2

      - name: Enable Alpha Features
        run: azd config set alpha.layers on

      - name: Set Development Environment Name
        run: |
          BASE_NAME="${{ vars.AZURE_ENV_NAME }}"
          # Use as-is if already ends with -dev, otherwise append -dev
          if [[ "$BASE_NAME" == *-dev ]]; then
            DEV_ENV_NAME="$BASE_NAME"
          else
            DEV_ENV_NAME="${BASE_NAME}-dev"
          fi
          echo "AZURE_ENV_NAME=${DEV_ENV_NAME}" >> $GITHUB_ENV
          echo "Development environment: ${DEV_ENV_NAME}"

      - name: Log in with Azure (Federated Credentials)
        run: |
          azd auth login \
            --client-id "$AZURE_CLIENT_ID" \
            --federated-credential-provider "github" \
            --tenant-id "$AZURE_TENANT_ID"

      - name: Provision Development Infrastructure
        run: azd provision --no-prompt

      - name: Build and Publish to Azure Container Registry
        id: publish
        run: |
          azd publish app --no-prompt
          
          # Get the published image name from azd environment
          PUBLISHED_IMAGE=$(azd env get-value SERVICE_APP_IMAGE_NAME)
          echo "published-image=${PUBLISHED_IMAGE}" >> $GITHUB_OUTPUT
          echo "Published image: ${PUBLISHED_IMAGE}"

      - name: Deploy to Development
        run: azd deploy app --from-package "${{ steps.publish.outputs.published-image }}" --no-prompt

  deploy-prod:
    needs: deploy-dev
    runs-on: ubuntu-latest
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE_ENV_TYPE: prod
      ACR_RESOURCE_GROUP_NAME: ${{ vars.ACR_RESOURCE_GROUP_NAME }}
      AZURE_CONTAINER_REGISTRY_ENDPOINT: ${{ vars.AZURE_CONTAINER_REGISTRY_ENDPOINT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install azd
        uses: Azure/setup-azd@v2

      - name: Enable Alpha Features
        run: azd config set alpha.layers on

      - name: Set Production Environment Name
        run: |
          BASE_NAME="${{ vars.AZURE_ENV_NAME }}"
          # Replace -dev with -prod, or append -prod if no suffix
          if [[ "$BASE_NAME" == *-dev ]]; then
            PROD_ENV_NAME="${BASE_NAME%-dev}-prod"
          else
            PROD_ENV_NAME="${BASE_NAME}-prod"
          fi
          echo "AZURE_ENV_NAME=${PROD_ENV_NAME}" >> $GITHUB_ENV
          echo "Production environment: ${PROD_ENV_NAME}"

      - name: Log in with Azure (Federated Credentials)
        run: |
          azd auth login \
            --client-id "$AZURE_CLIENT_ID" \
            --federated-credential-provider "github" \
            --tenant-id "$AZURE_TENANT_ID"

      - name: Deploy to Production
        run: azd deploy app --from-package "${{ needs.deploy-dev.outputs.container-image }}" --no-prompt